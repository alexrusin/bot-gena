version: "3"
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bot-gena-app
    restart: unless-stopped
    environment:
      - APP_NAME="Bot Gena"
      - APP_ENV=production
      - APP_KEY=base64:b1NEWoLkWfTCF2GfixWKMLJylq4zhq72TnT8Fh9FrFY=
      - APP_DEBUG=false
      - APP_LOG_LEVEL=debug
      - APP_URL=http://localhost:8000
      - LOG_CHANNEL=daily
      - NOTIFY_TIMEZONE=Europe/Minsk
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=bot_gena
      - DB_USERNAME=bot_gena_user
      - DB_PASSWORD=password
    working_dir: /var/www
    volumes:
      - ./:/var/www:cached
      - /var/www/vendor
      - /var/www/node_modules
    networks:
      - bot-gena-network

  db:
    image: mysql:5.7
    container_name: bot-gena-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: bot_gena
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_PASSWORD: password
      MYSQL_USER: bot_gena_user
      SERVICE_TAGS: dev
      SERVICE_NAME: mysql
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - bot-gena-network

  nginx:
    image: nginx:alpine
    container_name: bot-gena-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    networks:
      - bot-gena-network
networks:
  bot-gena-network:
    driver: bridge

volumes:
  dbdata:
